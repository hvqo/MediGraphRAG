[build-system]
requires = ["setuptools>=65.6.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medigraphrag"
version = "0.3.0"
description = "Medical evidence retrieval and question authoring workbench"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
medigraphrag = "backend.app.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.9.10"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-runtime.txt"]}

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["legacy", "model", "data", ".runtime", ".environment-wheels"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
