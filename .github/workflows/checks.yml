name: Source and application checks
on:
  push:
    branches: [main, refactor/medigraphrag, 'feature/**']
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-runtime.txt numpy==1.26.4 faiss-cpu==1.7.4 ruff==0.9.10
      - run: python scripts/check_repository.py
      - run: ruff check backend tests scripts main.py
      - run: ruff format --check backend tests scripts main.py
      - run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration placeholders
        run: |
          cp deploy/server.env.example deploy/server.env
          DOMAIN=container-check.invalid docker compose --env-file deploy/server.env config --quiet
      - name: Build full CPU application image
        run: docker build -t medigraph-check .
      - name: Check non-root image and secure account flow
        run: docker run --rm -v "$PWD/scripts/check_container.py:/app/check_container.py:ro" medigraph-check python /app/check_container.py
      - name: Validate HTTPS gateway configuration
        run: docker run --rm -e DOMAIN=container-check.invalid -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
